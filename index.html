
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prosta strona</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  margin: 20px;
}
.card {
  max-width: 600px;
  margin: auto;
  padding: 20px;
  background: white;
  border-radius: 10px;
}
button {
  padding: 10px;
  margin: 5px;
  cursor: pointer;
}
input, textarea {
  display: block;
  width: 100%;
  padding: 8px;
  margin: 5px 0 15px;
  box-sizing: border-box;
}
.view { display: none; }
.active { display: block; }
</style>
</head>

<body>

<div class="card">

<section id="home" class="view active">
  <h1>Witaj!</h1>
  <p>Wybierz opcję:</p>
  <button onclick="show('tekst')">Losowy tekst</button>
  <button onclick="show('formularz')">Formularz</button>
</section>

<section id="tekst" class="view">
  <h1>Losowy tekst</h1>
  <div id="tekstBox"></div>
  <button onclick="show('home')">Wróć</button>
  <button onclick="generate()">Losuj ponownie</button>
</section>

<section id="formularz" class="view">
  <h1>Formularz</h1>

  <form onsubmit="send(event)">
    <label>Imię</label>
    <input required>

    <label>Nazwisko</label>
    <input required>

    <label>Adres</label>
    <input required>

    <label>Kontakt</label>
    <input required>

    <label>
      <input type="checkbox" style="display:inline;width:auto">
      Mam prawo jazdy
    </label>

    <label>Uwagi</label>
    <textarea rows="4"></textarea>

    <button type="button" onclick="show('home')">Wróć</button>
    <button type="submit">Wyślij</button>
  </form>

  <p id="msg"></p>
</section>

</div>

<script>
function show(id) {
  document.querySelectorAll('.view').forEach(v =>
    v.classList.remove('active')
  );
  document.getElementById(id).classList.add('active');

  if (id === 'tekst') generate();
}

function generate() {
  let tekst = '';
  for (let i = 0; i < 5; i++) {
    tekst += '<p>' +
      Array.from({length: 10}, () =>
        ['lorem', 'ipsum', 'dolor', 'amet', 'sit'][Math.floor(Math.random()*5)]
      ).join(' ') + '.</p>';
  }
  document.getElementById('tekstBox').innerHTML = tekst;
}

function send(e) {
  e.preventDefault();
  e.target.reset();
  document.getElementById('msg').textContent = 'Formularz został wysłany.';
}
</script>

</body>
</html>
